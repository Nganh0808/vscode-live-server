<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hướng Dẫn Làm Bánh</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f8f8;
        }
        header {
            background-color: #ffcc99;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        nav {
            text-align: center;
            margin: 20px 0;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #333;
            font-size: 18px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .recipe {
            margin-bottom: 20px;
        }
        .recipe h2 {
            color: #ff6600;
        }
    </style>
</head>
<body>
    <header>
        Hướng Dẫn Làm Bánh
    </header>
    <nav>
        <a href="#">Trang chủ</a>
        <a href="#">Công thức</a>
        <a href="#">Mẹo vặt</a>
        <a href="#">Liên hệ</a>
    </nav>
    <div class="container">
        <div class="recipe">
            <h2>Bánh bông lan</h2>
            <p><strong>Nguyên liệu:</strong> Bột mì, trứng, đường, bơ...</p>
            <p><strong>Cách làm:</strong> Trộn bột, đánh trứng, nướng bánh...</p>
        </div>
        <div class="recipe">
            <h2>Bánh mì</h2>
            <p><strong>Nguyên liệu:</strong> Bột mì, men nở, nước...</p>
            <p><strong>Cách làm:</strong> Nhào bột, ủ bột, nướng bánh...</p>
        </div>
    </div>
</body>
</html>
